<div data-popover [id]="id()" role="tooltip" class="absolute z-50 invisible inline-block w-64 text-sm text-gray-500 transition-opacity duration-300 bg-white border border-gray-200 rounded-lg shadow-sm opacity-0 dark:text-gray-400 dark:border-gray-600 dark:bg-gray-800">
  <div class="px-3 py-2 bg-gray-100 border-b border-gray-200 rounded-t-lg dark:border-gray-600 dark:bg-gray-700">
      <h3 class="font-bold text-gray-900 dark:text-white">{{ title() }}</h3>
  </div>
  <div class="px-3 py-2">
      <p>{{text()}}</p>
  </div>
  <div data-popper-arrow></div>
</div>
<div
  [attr.data-popover-target]="id()"
  [attr.data-popover-placement]="position()"
  class="mx-auto flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 sm:mx-0 sm:h-8 sm:w-8"
>
  <svg class="h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" >
    <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
  </svg>
</div>
