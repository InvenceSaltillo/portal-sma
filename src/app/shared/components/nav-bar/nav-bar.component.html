<nav class="bg-gray-800">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <!-- Mobile menu button-->
        <button type="button" class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white" aria-controls="mobile-menu" aria-expanded="false">
          <span class="absolute -inset-0.5"></span>
          <span class="sr-only">Open main menu</span>
          <!--
            Icon when menu is closed.

            Menu open: "hidden", Menu closed: "block"
          -->
          <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <!--
            Icon when menu is open.

            Menu open: "block", Menu closed: "hidden"
          -->
          <svg class="hidden h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="flex flex-1 items-center justify-center sm:items-center sm:justify-start">
        <div class="flex flex-shrink-0 items-center">
          <img  src="assets/img/logo-sma.png" width="200px" alt="SMA Logo">
        </div>
        <div class="border-l border-gray-300 h-10 ml-4"></div>
        <span class="px-3 py-2 text-xl font-medium text-white" >Ecología</span>
        <div class="hidden sm:ml-6 sm:block w-full">
          <div class="flex justify-end space-x-4">
            <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
            <a
              [routerLink]="['home']"
              routerLinkActive="bg-gray-900"
              class="rounded-md  px-3 py-2 text-sm font-medium text-white" aria-current="page"
            >
              Inicio
            </a>
            <a
              [routerLink]="['request']"
              routerLinkActive="bg-gray-900"
              data-tooltip-target="tooltip-request"
              data-tooltip-placement="bottom"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >
              Solicitud
            </a>
            <a
              [routerLink]="['inquiry']"
              data-tooltip-target="tooltip-inquiry"
              data-tooltip-placement="bottom"
              routerLinkActive="bg-gray-900"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >
              Consulta
            </a>
            <a
              [routerLink]="['report']"
              data-tooltip-target="tooltip-report"
              data-tooltip-placement="bottom"
              routerLinkActive="bg-gray-900"
              class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >
              Informe
            </a>
          </div>
        </div>
      </div>
      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
        <!-- Profile dropdown -->
        <div class="relative ml-3">
          <div>
            <button
              type="button"
              class="relative flex items-center rounded-full bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800"
              id="user-menu-button"
              aria-expanded="false"
              aria-haspopup="true"
              (click)="showProfileMenu = !showProfileMenu"
            >
              <span class="absolute -inset-1.5"></span>
              <span class="sr-only">Open user menu</span>
              <img class="h-8 w-8 rounded-full" src="../../assets/img/avatar-default.png" alt="">
              <span class="text-white ml-4 text-lg">Cesar Riojas</span>
            </button>
          </div>

          <div [@showOrHide]="showProfileMenu" class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
            <a
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-400 hover:text-white"
              role="menuitem"
              tabindex="-1"
              id="user-menu-item-0"
            >
              Cambiar contraseña
            </a>
            <a
              href="#"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-400 hover:text-white"
              role="menuitem"
              tabindex="-1"
              id="user-menu-item-1"
            >
              Cerrar sesión
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile menu, show/hide based on menu state. -->
  <div class="sm:hidden" id="mobile-menu">
    <div class="space-y-1 px-2 pb-3 pt-2">
      <a
        [routerLink]="['home']"
        routerLinkActive="bg-gray-900"
        class="block rounded-md bg-gray-900 px-3 py-2 text-base font-medium text-white"
        aria-current="page"
      >
        Inicio
      </a>
      <a
        [routerLink]="['request']"
        routerLinkActive="bg-gray-900"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
      >
        Solicitud
      </a>
      <a
        [routerLink]="['inquiry']"
        routerLinkActive="bg-gray-900"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
      >
        Consulta
      </a>
      <a
        [routerLink]="['report']"
        routerLinkActive="bg-gray-900"
        class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
      >
        Informe
      </a>
    </div>
  </div>
</nav>
<app-tooltip [id]="'tooltip-request'" [label]="'Solicitud de trámite'"/>
<app-tooltip [id]="'tooltip-inquiry'" [label]="'Consulta tu trámite'"/>
<app-tooltip [id]="'tooltip-report'" [label]="'Presenta tu informe anual'"/>
