<div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="mb-6 flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Notificaciones</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Registro por usuario de avisos del sistema.
      </p>
    </div>
    <button
      type="button"
      (click)="loadNotifications()"
      class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      Actualizar
    </button>
  </div>

  @if (error(); as err) {
    <div class="mb-4 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400">
      {{ err }}
    </div>
  }

  <app-data-table
    [columns]="tableColumns"
    [value]="tableRows()"
    [loading]="loading()"
    [rowActions]="tableRowActions"
    [rows]="10"
    [globalFilterFields]="['title', 'message', 'status_label', 'created_at_label']"
    globalFilterPlaceholder="Buscar notificación..."
    [emptyMessage]="'No tienes notificaciones.'"
    [showRowNumberColumn]="false"
  />
</div>
