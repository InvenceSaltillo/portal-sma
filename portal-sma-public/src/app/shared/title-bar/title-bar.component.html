<div
  id="titlebar"
  class="sticky top-16 z-[60] text-white block p-3 overflow-hidden  bg-indigo-500 border-slate-100  mb-1 mt-8 shadow-md transition-all duration-200 ease-out"
  [ngClass]="{
    'text-center': textCenter(),
    'sm:mx-20': !isSticky,
    'mx-2': !isSticky,
    'rounded-md': !isSticky
  }"
  [class]="!textSize()  ? 'text-3xl' : 'text-2xl'"
>
  {{title()}}

  <div class="text-base">
    {{subTitle() ?? ''}}
  </div>
</div>
